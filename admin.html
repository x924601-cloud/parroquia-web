<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Parroquia Virgen de la Medalla Milagrosa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-dorado { color: #d4af37; }
        .bg-dorado { background-color: #d4af37; }
        .bg-celeste-oscuro { background-color: #0284c7; }
    </style>
</head>
<body class="bg-sky-50 min-h-screen flex items-center justify-center p-4">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-section" class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-t-4 border-amber-400">
        <h2 class="text-2xl font-bold text-center text-sky-900 mb-2">Acceso Administrativo</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Parroquia Virgen de la Medalla Milagrosa · Alcalde Díaz</p>

        <input type="email" id="email" placeholder="Correo electrónico" class="w-full mb-4 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
        <input type="password" id="password" placeholder="Contraseña" class="w-full mb-6 p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">

        <button id="btn-login" class="w-full bg-celeste-oscuro text-white font-bold py-3 rounded-lg hover:bg-sky-700 transition">Iniciar Sesión</button>
        <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden">Correo o contraseña incorrectos.</p>
    </div>

    <!-- PANEL DE CONTROL -->
    <div id="admin-section" class="hidden w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden border border-amber-200">
        <div class="bg-celeste-oscuro p-6 text-white flex flex-wrap justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Gestor de Contenido Parroquial</h1>
                <p class="text-sky-100 text-sm">Actualiza el mensaje, horarios y anuncios sin tocar el código</p>
            </div>
            <button id="btn-logout" class="bg-red-500 px-4 py-2 rounded-lg font-bold hover:bg-red-600 transition">Cerrar Sesión</button>
        </div>

        <div class="p-8 grid md:grid-cols-2 gap-8">
            <div>
                <label class="block text-sky-900 font-bold mb-2">Mensaje del Párroco / Bienvenida</label>
                <textarea id="input-mensaje" rows="7" class="w-full p-3 border border-gray-300 rounded-lg mb-5 focus:ring-2 focus:ring-sky-500 outline-none"></textarea>

                <label class="block text-sky-900 font-bold mb-2">Horarios de Misas, Adoración y Confesión</label>
                <textarea id="input-horarios" rows="8" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
            </div>

            <div class="flex flex-col justify-between">
                <div>
                    <label class="block text-sky-900 font-bold mb-2">Título del Anuncio Parroquial</label>
                    <input type="text" id="input-anuncio-titulo" placeholder="Ej: Avisos de la Semana / Próxima Actividad" class="w-full p-3 border border-gray-300 rounded-lg mb-5 focus:ring-2 focus:ring-sky-500 outline-none">

                    <label class="block text-sky-900 font-bold mb-2">Anuncios Parroquiales</label>
                    <textarea id="input-anuncio-desc" rows="10" placeholder="Escribe aquí los anuncios parroquiales vigentes..." class="w-full p-3 border border-gray-300 rounded-lg mb-5 focus:ring-2 focus:ring-sky-500 outline-none"></textarea>
                </div>

                <div>
                    <button id="btn-guardar" class="w-full bg-dorado text-white font-bold py-4 rounded-xl hover:bg-amber-600 transition shadow-lg text-lg">
                        GUARDAR CAMBIOS EN LA PÁGINA
                    </button>
                    <p id="save-msg" class="text-emerald-600 font-bold text-center mt-3 hidden">¡Cambios guardados y publicados en la página!</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUtkTIbLyykgdxgq0Le1iqG0IvZMehKc0",
            authDomain: "parroquia-medalla-milagrosa.firebaseapp.com",
            projectId: "parroquia-medalla-milagrosa",
            storageBucket: "parroquia-medalla-milagrosa.firebasestorage.app",
            messagingSenderId: "566502079957",
            appId: "1:566502079957:web:878ff30f6f83981e36515c",
            measurementId: "G-NQ6BD1DMQP"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const defaultData = {
            mensajeParroco: "Muchas gracias por su interés en nuestra Parroquia Virgen de la Medalla Milagrosa. Ya sea que esté de visita, que desee hacer de ella su comunidad, o que simplemente le interese saber más sobre nuestra parroquia, nos da mucho gusto tenerlo aquí. Nuestra parroquia se fundó en 1949 y, junto con otras once capillas, forma una amplia comunidad eclesial territorial donde caminamos juntos en comunión, participación y misión.",
            horariosMisa: "1. Celebración dominical:\n• 7:00 am: Las Malvinas, Villa Grecia, San Pablo, Quebrada Ancha\n• 9:00 am: Parroquia, Ciudad Bolívar, Milenio, Mocambo\n• 11:00 am: Ciudad El Amanecer, La Esperanza, Villa Nueva, El Tecal\n\n2. Adoración al Santísimo Sacramento:\n• Jueves: 9:00 am - 5:00 pm\n\n3. Confesión:\n• Martes a Viernes: 3:00 pm - 5:00 pm",
            tituloAnuncio: "Anuncios Parroquiales",
            descAnuncio: "Atención de oficina parroquial: Lunes a Viernes de 2:00 pm - 6:00 pm y Sábados de 9:00 am - 12:00 pm (Domingos cerrado). Para inscripciones a sacramentos o consultas, acércate a la oficina o comunícate al +507 6450 7111."
        };

        const loginSection = document.getElementById('login-section');
        const adminSection = document.getElementById('admin-section');
        const errorMsg = document.getElementById('login-error');
        const saveMsg = document.getElementById('save-msg');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                adminSection.classList.remove('hidden');

                const docSnap = await getDoc(doc(db, "contenidos", "principal"));
                const data = docSnap.exists() ? docSnap.data() : defaultData;

                document.getElementById('input-mensaje').value = data.mensajeParroco || defaultData.mensajeParroco;
                document.getElementById('input-horarios').value = data.horariosMisa || defaultData.horariosMisa;
                document.getElementById('input-anuncio-titulo').value = data.tituloAnuncio || data.tituloEvento || defaultData.tituloAnuncio;
                document.getElementById('input-anuncio-desc').value = data.descAnuncio || data.descEvento || defaultData.descAnuncio;
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            signInWithEmailAndPassword(auth, email, pass)
                .catch(() => { errorMsg.classList.remove('hidden'); });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth);
        });

        document.getElementById('btn-guardar').addEventListener('click', async () => {
            const btn = document.getElementById('btn-guardar');
            btn.innerText = "Guardando...";

            const newData = {
                mensajeParroco: document.getElementById('input-mensaje').value,
                horariosMisa: document.getElementById('input-horarios').value,
                tituloAnuncio: document.getElementById('input-anuncio-titulo').value,
                descAnuncio: document.getElementById('input-anuncio-desc').value
            };

            await setDoc(doc(db, "contenidos", "principal"), newData, { merge: true });

            btn.innerText = "GUARDAR CAMBIOS EN LA PÁGINA";
            saveMsg.classList.remove('hidden');
            setTimeout(() => { saveMsg.classList.add('hidden'); }, 3000);
        });
    </script>
</body>
</html>
